<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-labelledby="title description">
  <title id="title">Anki Bridge workflow and development status</title>
  <desc id="description">Version 0.8.0 is an installable personal-use candidate, not a public release. Choose ideas from a session or the whole graph, draft cards in the background, then edit, approve and tag cards before sending them to Anki or downloading a package.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="296" rx="20" fill="#f6f7f9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="32" y="39" font-size="15" font-weight="700" letter-spacing="2" fill="#475569">WORKFLOW</text>
    <text x="32" y="67" font-size="16" fill="#475569">Draft from a graph. Approve before sending or exporting.</text>
    <text x="1168" y="39" text-anchor="end" font-size="15" font-weight="700" fill="#475569">0.8.0 · PERSONAL-USE CANDIDATE</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 273 164 H 310"/>
      <path d="M 563 164 H 600"/>
      <path d="M 853 164 H 890"/>
    </g>
    <rect x="32" y="96" width="240" height="139" rx="12" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="322" y="96" width="240" height="139" rx="12" fill="#ecfdf5" stroke="#15803d"/>
    <rect x="612" y="96" width="240" height="139" rx="12" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="902" y="96" width="266" height="139" rx="12" fill="#ecfdf5" stroke="#15803d"/>
    <g font-size="21" font-weight="650" fill="#0f172a">
      <text x="52" y="133">1 Choose ideas</text>
      <text x="342" y="133">2 Write cards</text>
      <text x="632" y="133">3 Review &amp; send</text>
      <text x="922" y="133">Anki</text>
    </g>
    <g font-size="16" fill="#334155">
      <text x="52" y="166">One session or the graph</text>
      <text x="342" y="166">Facts and equations first</text>
      <text x="632" y="166">Edit, approve and tag</text>
      <text x="922" y="166">AnkiConnect or .apkg import</text>
    </g>
    <g font-size="14" font-weight="600">
      <text x="52" y="209" fill="#166534">0.7.0 · MERGED</text>
      <text x="342" y="209" fill="#166534">0.7.2 · MERGED</text>
      <text x="632" y="209" fill="#166534">0.8.0 · EXPORT ADDED</text>
      <text x="922" y="209" fill="#166534">0.8.0 · REVIEW CHECKS</text>
    </g>
    <text x="32" y="271" font-size="15" fill="#475569">Optional read-only review check for cards sent to AnkiConnect.</text>
  </g>
</svg>
